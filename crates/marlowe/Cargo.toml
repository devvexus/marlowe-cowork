[package]
name = "marlowe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Marlowe binary: TUI client, daemon, and headless commands."

[dependencies]
marlowe-model.workspace = true
marlowe-proto.workspace = true
marlowe-agent.workspace = true
marlowe-brains.workspace = true
marlowe-daemon.workspace = true
marlowe-tui.workspace = true
# Concrete providers and tools are wired here and nowhere else.
marlowe-provider.workspace = true
marlowe-openrouter.workspace = true
marlowe-exec.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
crossterm.workspace = true

# SetHandleInformation for the detached daemon spawn (daemon_ctl.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
