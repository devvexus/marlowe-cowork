[package]
name = "marlowe-surface"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal rendering foundation: palette, regions, markdown, meter. Rendering and input only — no policy, no state the daemon lacks."

[dependencies]
# **`marlowe-view` and no producer.** Nothing in this crate can name a producer, so a surface
# cannot author session state even by accident. ARCHITECTURE §2.14 is a property of this file.
marlowe-view.workspace = true
# **The display sanitiser, and nothing else from this crate.** `marlowe-contract` is the deepest
# crate in the workspace and holds no producer, so this does not weaken the note above: a surface
# still cannot author session state. What it can now do is refuse to print an escape sequence.
marlowe-contract.workspace = true
ratatui.workspace = true
crossterm.workspace = true
# Maths. Both are already linked into the binary (ratatui pulls in unicode-width; marlowe-memory
# uses unicode-normalization), so neither adds a byte: display widths for combining accents, and
# NFC to find the precomposed form of an accented letter (`\hat{y}` is U+0177).
unicode-width = "0.2.2"
unicode-normalization.workspace = true
