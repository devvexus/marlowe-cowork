[package]
name = "marlowe-permission"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
marlowe-contract.workspace = true
marlowe-tools.workspace = true
serde.workspace = true
unicode-normalization.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Windows: real object identity (volume serial + file index) read from a handle.
# `std::os::windows::fs::MetadataExt::{file_index, volume_serial_number}` are still unstable, and
# a weaker stand-in would read the same whether or not the object had been replaced.
[target.'cfg(windows)'.dependencies]
same-file = "1"

# POSIX: `openat` with O_NOFOLLOW. std exposes no handle-relative open, and without one the
# component-at-a-time walk is not possible -- which is the whole containment on this platform.
[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", features = ["fs"] }
