[package]
name = "marlowe-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CONTRACTS.md sections 2-3 - content store, belief store, trust propagation."

[dependencies]
marlowe-contract.workspace = true
marlowe-journal.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
unicode-general-category.workspace = true
ort.workspace = true
sha2.workspace = true
marlowe-ort-gpu = { workspace = true, optional = true }

[features]
# GPU execution for the cross-encoder cascade: CUDA, then DirectML, then CPU, taken only while the
# GPU is idle. Off by default; the shipped, measured scorer is CPU. See src/ep.rs.
cuda = ["dep:marlowe-ort-gpu"]
