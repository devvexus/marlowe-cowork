[package]
name = "marlowe-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The terminal client: Conversation + Situation Board, Library, approvals."

[dependencies]
marlowe-model.workspace = true
marlowe-proto.workspace = true
marlowe-surface.workspace = true
# Display maths as typeset images where the terminal speaks Sixel: the worker, cache and the client
# of `marlowe-typeset.exe`. Typst itself runs in that helper process and is never linked here.
marlowe-typeset.workspace = true
# Asking the terminal what it can show, before the input thread starts.
marlowe-os.workspace = true
ratatui.workspace = true
crossterm.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true
serde_json.workspace = true
# Wall-clock time for the title bar clock (local time zone).
chrono.workspace = true
# Display widths for wrapping (already in the lock via ratatui).
unicode-width = "0.2.2"

[dev-dependencies]
# The planner tests build a real plan from the GGUF-header fixtures marlowe-hw keeps.
marlowe-hw.workspace = true
