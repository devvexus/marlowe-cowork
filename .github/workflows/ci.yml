# MarloweCowork CI.
#
# Not run on every push: manual dispatch plus a weekly run. A green badge here says nothing about
# model-dependent tests (models/ is git-ignored, those tests print SKIP), retrieval quality
# (data/ is git-ignored), GPU paths, or anything perceptual in the TUI.

name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  eval:
    name: eval harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pytest
        working-directory: eval
        run: python -m pytest -q

  workspace:
    name: cargo test --workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup default stable
          rustc --version
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: cargo test --workspace --no-fail-fast
        run: cargo test --workspace --no-fail-fast

      # Path-scope escapes are the wall around every file tool, so the traversal suite must not
      # pass by silently skipping classes. Linux runs every class (including symlink escape);
      # Windows may skip only the symlink class, which needs privileges runners lack.
      - name: Traversal suite — every declared class accounted for
        if: ${{ !cancelled() }}
        env:
          MARLOWE_TRAVERSAL_STRICT: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          set -euo pipefail
          cargo test -p marlowe-permission --test traversal -- \
            --exact every_traversal_class_is_accounted_for --nocapture 2>&1 | tee traversal.log
          declared=$(grep -c 'manifest.push' crates/marlowe-permission/tests/traversal.rs)
          ran=$(grep -c '^  RAN ' traversal.log || true)
          unrunnable=$(grep -c '^  UNRUNNABLE ' traversal.log || true)
          echo "declared=$declared ran=$ran unrunnable=$unrunnable"
          if [ "$ran" -eq 0 ]; then echo "::error::the traversal suite did not run"; exit 1; fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            [ "$ran" -eq "$declared" ] || { echo "::error::$ran of $declared classes ran on Linux"; exit 1; }
          else
            [ $((ran + unrunnable)) -eq "$declared" ] || { echo "::error::manifest incomplete"; exit 1; }
            if [ "$unrunnable" -gt 1 ] || { [ "$unrunnable" -eq 1 ] && ! grep -q '^  UNRUNNABLE  symlink escape' traversal.log; }; then
              echo "::error::only 'symlink escape' may be unrunnable on Windows"; grep '^  UNRUNNABLE ' traversal.log; exit 1
            fi
          fi

      - name: Model-dependent tests that skipped (visibility only)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          echo "models/ present? $( [ -d models ] && echo yes || echo no )"
          cargo test -p marlowe-memory --no-fail-fast -- --nocapture 2>&1 | grep -E '^SKIP:' | sort -u || true
