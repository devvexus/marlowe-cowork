[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marlowe-eval"
version = "0.1.0"
description = "M0a: the Marlowe memory eval harness. Scores any implementation behind CONTRACTS.md section 4."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

# The API-backed judge is an EXTRA on purpose. See METHODOLOGY.md: it is unrunnable
# without an explicit opt-in and a human label set, and installing it grants neither.
[project.optional-dependencies]
judge = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
marlowe-eval = "marlowe_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
