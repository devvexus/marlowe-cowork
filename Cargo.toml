[workspace]
resolver = "2"
members = [
    # Foundation crates inherited from Marlowe_Harness, compiling on their own as of M0.
    "crates/marlowe-contract",
    "crates/marlowe-journal",
    "crates/marlowe-memory",
    "crates/marlowe-net",
    "crates/marlowe-extract",
    "crates/marlowe-tools",
    "crates/marlowe-permission",
    "crates/marlowe-mcp",
    "crates/marlowe-view",
    "crates/marlowe-surface",
    # M1: the model seam, wire protocol, loop, library, daemon and client.
    "crates/marlowe-model",
    "crates/marlowe-proto",
    "crates/marlowe-agent",
    "crates/marlowe-brains",
    "crates/marlowe-daemon",
    "crates/marlowe-tui",
    # M1: ported onto `marlowe-model`.
    "crates/marlowe-provider",
    "crates/marlowe-openrouter",
    "crates/marlowe-exec",
    "crates/marlowe",
    # M2: the memory service.
    "crates/marlowe-mind",
    # M3: the Wake — watchers, notices, the brief, and spoken voice.
    "crates/marlowe-sentinel",
    "crates/marlowe-voice",
    # M4: the Crew — durable sandboxed runs, playbooks, and the Job Object wrapper.
    "crates/marlowe-os",
    "crates/marlowe-crew",
    # Typeset maths: the image client (probe, Sixel, worker) and the Typst helper process
    # (`marlowe-typeset.exe`), which `marlowe.exe` starts lazily and never links.
    "crates/marlowe-typeset",
    "crates/marlowe-typeset-helper",
    # M4.5: context and hardware planner (GGUF header, KV/state maths, VRAM budget).
    "crates/marlowe-hw",
]
# Reference sources only; never built.
exclude = ["legacy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
marlowe-contract = { path = "crates/marlowe-contract" }
marlowe-journal = { path = "crates/marlowe-journal" }
marlowe-memory = { path = "crates/marlowe-memory" }
marlowe-view = { path = "crates/marlowe-view" }
marlowe-surface = { path = "crates/marlowe-surface" }
marlowe-tools = { path = "crates/marlowe-tools" }
marlowe-permission = { path = "crates/marlowe-permission" }
marlowe-net = { path = "crates/marlowe-net" }
marlowe-extract = { path = "crates/marlowe-extract" }
marlowe-mcp = { path = "crates/marlowe-mcp" }
marlowe-model = { path = "crates/marlowe-model" }
marlowe-proto = { path = "crates/marlowe-proto" }
marlowe-agent = { path = "crates/marlowe-agent" }
marlowe-brains = { path = "crates/marlowe-brains" }
marlowe-daemon = { path = "crates/marlowe-daemon" }
marlowe-tui = { path = "crates/marlowe-tui" }
marlowe-provider = { path = "crates/marlowe-provider" }
marlowe-openrouter = { path = "crates/marlowe-openrouter" }
marlowe-exec = { path = "crates/marlowe-exec" }
marlowe-mind = { path = "crates/marlowe-mind" }
marlowe-sentinel = { path = "crates/marlowe-sentinel" }
marlowe-voice = { path = "crates/marlowe-voice" }
marlowe-os = { path = "crates/marlowe-os" }
marlowe-crew = { path = "crates/marlowe-crew" }
marlowe-typeset = { path = "crates/marlowe-typeset" }
marlowe-hw = { path = "crates/marlowe-hw" }

# Terminal. crossterm, not termion: Windows is the primary platform.
ratatui = "0.30"
crossterm = "0.29"

# Finite-automata regex: linear worst case, no catastrophic backtracking.
regex = "1"

serde = { version = "1", features = ["derive"] }
# No `preserve_order`: keys serialize sorted, which journal signatures depend on.
serde_json = "1"
blake3 = "1"
hmac = "0.12"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
unicode-normalization = "0.1"
unicode-general-category = "1"
# ONNX Runtime for the embedder and cross-encoder. EXACT version: ort-sys pins the runtime by
# sha256 per target and links it statically. CPU only — the old `cuda` feature is gone, which is
# what lets aarch64-pc-windows-msvc build (rc.10 ships a static ARM64-Windows runtime).
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
getrandom = "0.2"

# The daemon is std threads + channels, not an async runtime: everything inherited blocks.
crossbeam-channel = "0.5"
# Local wall-clock time for the system prompt's environment block and session timestamps.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# API keys live in Windows Credential Manager, never on disk.
keyring = { version = "3", features = ["windows-native"] }

# M3. File events for the Sentinel (ReadDirectoryChangesW on Windows); debounced in-crate.
notify = "8.2"
# NVML loaded at runtime (nvml.dll); absent means "GPU unavailable", never a build dependency.
nvml-wrapper = "0.13"
# WinRT speech and playback for the in-daemon voice, plus the Win32 process query the Sentinel
# uses to ask whether a pid is alive (query-limited rights; never signals). Pinned exactly.
windows = { version = "=0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Core",
    "Media_Playback",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# M4. Job Objects for marlowe-os (kill-on-close process trees). Same family as `windows` above.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
debug = 1
lto = "thin"
