[workspace]
resolver = "2"
members = [
    # Foundation crates inherited from Marlowe_Harness, compiling on their own as of M0.
    "crates/marlowe-contract",
    "crates/marlowe-journal",
    "crates/marlowe-memory",
    "crates/marlowe-net",
    "crates/marlowe-extract",
    "crates/marlowe-tools",
    "crates/marlowe-permission",
    "crates/marlowe-mcp",
    "crates/marlowe-view",
    "crates/marlowe-surface",
    # M1: the model seam, wire protocol, loop, library, daemon and client.
    "crates/marlowe-model",
    "crates/marlowe-proto",
    "crates/marlowe-agent",
    "crates/marlowe-brains",
    "crates/marlowe-daemon",
    "crates/marlowe-tui",
    # M1: ported onto `marlowe-model`.
    "crates/marlowe-provider",
    "crates/marlowe-openrouter",
    "crates/marlowe-exec",
    "crates/marlowe",
    # M2: the memory service.
    "crates/marlowe-mind",
    # M3: the Wake — watchers, notices, the brief, and spoken voice.
    "crates/marlowe-sentinel",
    "crates/marlowe-voice",
    # M4: the Crew — durable sandboxed runs, playbooks, and the Job Object wrapper.
    "crates/marlowe-os",
    "crates/marlowe-crew",
    # Typeset maths: the image client (probe, Sixel, worker) and the Typst helper process
    # (`marlowe-typeset.exe`), which `marlowe.exe` starts lazily and never links.
    "crates/marlowe-typeset",
    "crates/marlowe-typeset-helper",
    # M4.5: research sources (channels, identity dedup, corroboration, link tables, cache).
    "crates/marlowe-research",
    # M4.5: GPU feature shim for ONNX Runtime (no code).
    "crates/marlowe-ort-gpu",
    # M4.5: context and hardware planner (GGUF header, KV/state maths, VRAM budget).
    "crates/marlowe-hw",
    # M4.6: full-stack engineering (seam skeletons; each owned by one track, design section 7).
    "crates/marlowe-code",
    "crates/marlowe-verify",
    "crates/marlowe-settings",
    "crates/marlowe-anthropic",
    # M4.6 wave 2: the workflow engine (track W).
    "crates/marlowe-workflow",
    # Projects: plan, state JSON, forms with display hints, the generic view-model, the store.
    "crates/marlowe-project",
]
# Reference sources only; never built.
exclude = ["legacy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
marlowe-contract = { path = "crates/marlowe-contract" }
marlowe-journal = { path = "crates/marlowe-journal" }
marlowe-memory = { path = "crates/marlowe-memory" }
marlowe-view = { path = "crates/marlowe-view" }
marlowe-surface = { path = "crates/marlowe-surface" }
marlowe-tools = { path = "crates/marlowe-tools" }
marlowe-permission = { path = "crates/marlowe-permission" }
marlowe-net = { path = "crates/marlowe-net" }
marlowe-extract = { path = "crates/marlowe-extract" }
marlowe-mcp = { path = "crates/marlowe-mcp" }
marlowe-model = { path = "crates/marlowe-model" }
marlowe-proto = { path = "crates/marlowe-proto" }
marlowe-agent = { path = "crates/marlowe-agent" }
marlowe-brains = { path = "crates/marlowe-brains" }
marlowe-daemon = { path = "crates/marlowe-daemon" }
marlowe-tui = { path = "crates/marlowe-tui" }
marlowe-provider = { path = "crates/marlowe-provider" }
marlowe-openrouter = { path = "crates/marlowe-openrouter" }
marlowe-exec = { path = "crates/marlowe-exec" }
marlowe-mind = { path = "crates/marlowe-mind" }
marlowe-sentinel = { path = "crates/marlowe-sentinel" }
marlowe-voice = { path = "crates/marlowe-voice" }
marlowe-os = { path = "crates/marlowe-os" }
marlowe-crew = { path = "crates/marlowe-crew" }
marlowe-typeset = { path = "crates/marlowe-typeset" }
marlowe-research = { path = "crates/marlowe-research" }
marlowe-ort-gpu = { path = "crates/marlowe-ort-gpu" }
marlowe-hw = { path = "crates/marlowe-hw" }
marlowe-code = { path = "crates/marlowe-code" }
marlowe-verify = { path = "crates/marlowe-verify" }
marlowe-settings = { path = "crates/marlowe-settings" }
marlowe-anthropic = { path = "crates/marlowe-anthropic" }
marlowe-workflow = { path = "crates/marlowe-workflow" }
marlowe-project = { path = "crates/marlowe-project" }

# Terminal. crossterm, not termion: Windows is the primary platform.
ratatui = "0.30"
crossterm = "0.29"

# Finite-automata regex: linear worst case, no catastrophic backtracking.
regex = "1"

serde = { version = "1", features = ["derive"] }
# `preserve_order`: a tool call's arguments go back to the model in the order it wrote them (a
# re-sorted key list changes the prompt and costs a local model its cache). Journal signatures
# are over the stored payload string, not a re-serialisation, so they do not depend on key order.
serde_json = { version = "1", features = ["preserve_order"] }
blake3 = "1"
hmac = "0.12"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
unicode-normalization = "0.1"
unicode-general-category = "1"
# ONNX Runtime for the embedder and cross-encoder. EXACT version: ort-sys pins the runtime by
# sha256 per target and links it statically (rc.13 = ONNX Runtime 1.28.0; the Windows builds carry
# DirectML on both x64 and ARM64). The default build is CPU. GPU is opt-in through
# `marlowe-memory/cuda`, which adds per-target features via `crates/marlowe-ort-gpu`.
ort = { version = "=2.0.0-rc.13", features = ["download-binaries"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
getrandom = "0.2"

# The daemon is std threads + channels, not an async runtime: everything inherited blocks.
crossbeam-channel = "0.5"
# Local wall-clock time for the system prompt's environment block and session timestamps.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# API keys live in Windows Credential Manager, never on disk.
keyring = { version = "3", features = ["windows-native"] }

# M3. File events for the Sentinel (ReadDirectoryChangesW on Windows); debounced in-crate.
notify = "8.2"
# NVML loaded at runtime (nvml.dll); absent means "GPU unavailable", never a build dependency.
nvml-wrapper = "0.13"
# WinRT speech and playback for the in-daemon voice, plus the Win32 process query the Sentinel
# uses to ask whether a pid is alive (query-limited rights; never signals). Pinned exactly.
# M4.6 (9.1-k): toast notifications (`marlowe-os/src/toast.rs`: `ToastNotificationManager`, its XML
# document) and the one HKCU key that names the sender (`Software\Classes\AppUserModelId`).
windows = { version = "=0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "Media_Core",
    "Media_Playback",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# M4. Job Objects for marlowe-os (kill-on-close process trees). Same family as `windows` above.
windows-sys = { version = "=0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# Disk (2026-10-14): full debug info let target\debug reach 300 GB (1,311 stale .pdb files of up to
# 800 MB each). Line tables keep panics and backtraces readable; dependencies carry none.
# scripts/cargo-idle.ps1 also caps target\ and prunes stale artifacts.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The main-content candidates (marlowe-extract) stay optimised and quiet in dev and test builds:
# unoptimised they run 10-30x slower and trip the selector's time cap on ordinary pages, and
# rs-trafilatura prints DEBUG lines to stderr whenever debug assertions are on.
[profile.dev.package.rs-trafilatura]
opt-level = 3
debug-assertions = false

[profile.dev.package.rust-trafilatura]
opt-level = 3

[profile.dev.package.web-page-classifier]
opt-level = 3

[profile.dev.package.dom_query]
opt-level = 3

[profile.dev.package.html5ever]
opt-level = 3

[profile.dev.package.markup5ever]
opt-level = 3

[profile.dev.package.tendril]
opt-level = 3

[profile.dev.package.selectors]
opt-level = 3

[profile.dev.package.cssparser]
opt-level = 3

[profile.dev.package.string_cache]
opt-level = 3

[profile.dev.package.rust-readability-v2]
opt-level = 3

[profile.dev.package.rust-domdistiller]
opt-level = 3

[profile.dev.package.html-cleaning]
opt-level = 3

[profile.dev.package.rust-htmldate]
opt-level = 3

[profile.dev.package.rust-py3langid]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
